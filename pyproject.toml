[project]
name = "demo_reusable"
version = "0.1.0"
description = "Minimal package for CI/CD best-practice demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=demo_reusable --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
